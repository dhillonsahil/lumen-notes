<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0F0F12" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warm Radiant Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </radialGradient>

    <!-- Facet Gradients for the Luminous Prism / Folded Quill -->
    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="facetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="facetBodyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="facetBodyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="facetTip" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Ambient Light Pulse -->
  <circle cx="256" cy="245" r="180" fill="url(#ambientGlow)" />

  <!-- The Lumen Prism Motif (Folded Illuminated Quill & Star) -->
  <g transform="translate(256, 252)" filter="url(#glow)">
    <!-- Back Light Halo Sparks -->
    <path d="M 0 -130 L 4 -40 L 40 -4 L 0 0 L -40 -4 L -4 -40 Z" fill="#FBBF24" opacity="0.35" />
    
    <!-- Left Crown Facet -->
    <polygon points="0,-120 -82,-35 0,-15" fill="url(#facetTopLeft)" />

    <!-- Right Crown Facet (Highlight) -->
    <polygon points="0,-120 82,-35 0,-15" fill="url(#facetTopRight)" />

    <!-- Left Body Wing -->
    <polygon points="-82,-35 0,-15 -42,85" fill="url(#facetBodyLeft)" />

    <!-- Right Body Wing -->
    <polygon points="82,-35 0,-15 42,85" fill="url(#facetBodyRight)" />

    <!-- Center Spine / Prism Crease -->
    <polygon points="0,-15 -42,85 0,135" fill="url(#facetBodyLeft)" opacity="0.85" />
    <polygon points="0,-15 42,85 0,135" fill="url(#facetBodyRight)" />

    <!-- Bottom Nib Point -->
    <polygon points="-42,85 0,135 0,150 -10,135" fill="url(#facetTip)" />
    <polygon points="42,85 0,135 0,150 10,135" fill="url(#facetTip)" />

    <!-- Central Radiant Star Core -->
    <path d="M 0 -45 Q 0 -15 25 -15 Q 0 -15 0 15 Q 0 -15 -25 -15 Q 0 -15 0 -45 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="0" cy="-15" r="5" fill="#FFFBEB" />

    <!-- Luminous Flare Accent -->
    <circle cx="35" cy="-60" r="4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="-45" cy="25" r="3" fill="#FDE68A" opacity="0.6" />
  </g>
</svg>
